<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reconhecimento antigênico</title>
<style>body{margin:0;background:#08111f;color:#f0f5ff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}#s{max-width:680px;padding:32px;text-align:center}</style>
</head>
<body><div id="s">Carregando atividade de reconhecimento antigênico…</div>
<script>
(async()=>{
 const parts=Array.from({length:17},(_,i)=>`part-${String(i+1).padStart(2,"0")}.txt`);
 const html=(await Promise.all(parts.map(async p=>{
   const r=await fetch(p,{cache:"no-store"});
   if(!r.ok) throw new Error(`${p}: ${r.status}`);
   return r.text();
 }))).join("");
 document.open();
 document.write(html);
 document.close();
})().catch(e=>{
 document.getElementById("s").innerHTML="<strong>Não foi possível carregar a atividade.</strong><br><small>"+String(e)+"</small>";
});
</script>
</body>
</html>
